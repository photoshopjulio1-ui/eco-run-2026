<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Run 2026 - Leitor de Check-in e Kits</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root { --primary: #2e7d32; --bg: #1e1e1e; --card: #2c2c2c; --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #81c784; font-size: 1.5rem; text-transform: uppercase; }

        #reader { width: 100%; max-width: 500px; border-radius: 10px; overflow: hidden; border: 4px solid var(--primary); background: #000; margin-bottom: 20px; }
        .loading { display: none; color: #ffeb3b; font-size: 1.2rem; font-weight: bold; margin: 20px 0; }

        .result-card { display: none; background: var(--card); width: 100%; max-width: 500px; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: left; }
        .result-card h2 { color: #81c784; margin-bottom: 5px; font-size: 1.4rem; border-bottom: 1px solid #555; padding-bottom: 5px;}
        
        /* Nova Área para o Número do Atleta */
        .numero-atleta { font-size: 1.2rem; color: #ff9800; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #555; padding-bottom: 10px;}
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; }
        .info-value { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .info-full { grid-column: span 2; }
        
        .status-badge { margin-top: 20px; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .status-ok { background: #d4edda; color: #155724; }
        .status-pendente { background: #fff3cd; color: #856404; }

        .btn-confirmar { display: block; width: 100%; padding: 15px; margin-top: 20px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-confirmar:active { transform: scale(0.98); }
        .btn-confirmar:disabled { background: #555; cursor: not-allowed; color: #999; }
        .btn-voltar { display: block; width: 100%; padding: 12px; margin-top: 10px; background-color: #555; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background: var(--card); padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%; }
        .login-box h2 { color: #81c784; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: none; border-radius: 5px; font-size: 1rem; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .btn-login:disabled { background: #555; }
        #loginMsg { margin-top: 15px; color: #ff5252; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>Acesso Restrito</h2>
            <input type="password" id="inputSenha" placeholder="Senha do Administrador">
            <button id="btnLogin" class="btn-login" onclick="fazerLogin()">Acessar Leitor</button>
            <div id="loginMsg"></div>
        </div>
    </div>

    <div class="header">
        <h1>Eco Run 2026</h1>
        <p>Validação & Entrega de Kits</p>
    </div>

    <div id="reader"></div>
    <div id="loading" class="loading">Buscando Inscrição...</div>

    <div id="result-card" class="result-card">
        <h2 id="rNome">Nome do Atleta</h2>
        <div class="numero-atleta">Número: <span id="rNumero" style="color: #fff;">-</span></div>
        <div class="info-grid">
            <div class="info-item"><span class="info-label">Tamanho Camisa</span><span class="info-value" id="rCamisa">-</span></div>
            <div class="info-item"><span class="info-label">Categoria</span><span class="info-value" id="rCategoria">-</span></div>
            <div class="info-item info-full"><span class="info-label">Equipe</span><span class="info-value" id="rEquipe">-</span></div>
        </div>
        <div id="statusKit" class="status-badge"></div>
        <button id="btnConfirmar" class="btn-confirmar">CONFIRMAR ENTREGA DO KIT</button>
        <button id="btnVoltar" class="btn-voltar" onclick="reiniciarScanner()">Voltar para a Câmera</button>
    </div>

    <script>
        // ⚠️ SUBSTITUA COM A URL DO SEU NOVO DEPLOY
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCAfptJOIm7-yjj1L3Ji8NCQFT7sk5FYyydEyiiBtp4iJJwVoOfUMb_GG21932GPtb/exec'; 
        
        const html5QrCode = new Html5Qrcode("reader");
        let linhaAtualSelecionada = null; // Guardamos o rowIndex retornado pelo backend para atualizar o kit
        let senhaAdmin = sessionStorage.getItem('ecoRunSenha');

        function verificarAcesso() {
            if (!senhaAdmin) {
                document.getElementById('loginOverlay').style.display = 'flex';
            } else {
                document.getElementById('loginOverlay').style.display = 'none';
                iniciarScanner();
            }
        }

        function fazerLogin() {
            const input = document.getElementById('inputSenha').value;
            const btn = document.getElementById('btnLogin');
            const msg = document.getElementById('loginMsg');
            
            btn.innerText = 'Validando...';
            btn.disabled = true;
            msg.style.display = 'none';

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: 'login', senha: input })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'sucesso') {
                    senhaAdmin = input;
                    sessionStorage.setItem('ecoRunSenha', senhaAdmin);
                    document.getElementById('loginOverlay').style.display = 'none';
                    iniciarScanner();
                } else {
                    msg.innerText = data.mensagem;
                    msg.style.display = 'block';
                }
            })
            .catch(err => {
                msg.innerText = 'Erro ao conectar. Verifique a URL do Script.';
                msg.style.display = 'block';
            })
            .finally(() => {
                btn.innerText = 'Acessar Leitor';
                btn.disabled = false;
            });
        }

        function iniciarScanner() {
            document.getElementById("result-card").style.display = "none";
            document.getElementById("reader").style.display = "block";
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText, decodedResult) => {
                    if(decodedText.startsWith("ECO26ID-")) {
                        const cpfID = decodedText.split("-")[1]; // Extrai o CPF do QR Code
                        html5QrCode.stop().then(() => {
                            buscarInscricao(cpfID);
                        }).catch(err => console.error(err));
                    } else {
                        alert("QR Code inválido para este evento!");
                    }
                },
                (errorMessage) => { }
            ).catch((err) => {
                alert("Erro ao acessar a câmera. Dê permissão.");
            });
        }

        function buscarInscricao(cpfID) {
            document.getElementById("reader").style.display = "none";
            document.getElementById("loading").style.display = "block";

            // Envia a busca com o parâmetro cpf
            fetch(SCRIPT_URL + "?cpf=" + cpfID + "&senha=" + encodeURIComponent(senhaAdmin))
            .then(res => res.json())
            .then(data => {
                document.getElementById("loading").style.display = "none";
                if(data.status === "erro") {
                    alert(data.mensagem);
                    if(data.mensagem.includes("Acesso negado")) location.reload();
                    return reiniciarScanner();
                }
                
                if(data.length > 0) {
                    exibirDados(data[0]);
                } else {
                    alert("Inscrição não encontrada (CPF: " + cpfID + ")!");
                    reiniciarScanner();
                }
            })
            .catch(err => {
                alert("Erro na conexão!");
                reiniciarScanner();
            });
        }

        function exibirDados(atleta) {
            // O backend retorna a linha onde o atleta está HOJE, garantindo precisão ao atualizar o Kit
            linhaAtualSelecionada = atleta.rowIndex; 
            
            document.getElementById("rNome").innerText = atleta.nome;
            document.getElementById("rNumero").innerText = atleta.numero ? atleta.numero : "Não atribuído";
            document.getElementById("rCamisa").innerText = atleta.tamCamisa;
            document.getElementById("rCategoria").innerText = atleta.categoria;
            document.getElementById("rEquipe").innerText = atleta.equipe || "S/ Equipe";

            const statusDiv = document.getElementById("statusKit");
            const btn = document.getElementById("btnConfirmar");

            if(atleta.kitEntregue === "SIM") {
                statusDiv.className = "status-badge status-ok";
                statusDiv.innerText = "KIT JÁ FOI ENTREGUE";
                btn.disabled = true;
                btn.innerText = "Entrega Bloqueada";
            } else {
                statusDiv.className = "status-badge status-pendente";
                statusDiv.innerText = "KIT PENDENTE DE ENTREGA";
                btn.disabled = false;
                btn.innerText = "CONFIRMAR ENTREGA DO KIT";
            }
            document.getElementById("result-card").style.display = "block";
        }

        document.getElementById("btnConfirmar").addEventListener("click", function() {
            if(!linhaAtualSelecionada) return;

            this.disabled = true;
            this.innerText = "Salvando...";

            const payload = {
                acao: "marcarKit",
                rowIndex: linhaAtualSelecionada,
                status: "SIM",
                senha: senhaAdmin
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if(data.status === "sucesso") {
                    document.getElementById("statusKit").className = "status-badge status-ok";
                    document.getElementById("statusKit").innerText = "ENTREGA CONFIRMADA COM SUCESSO!";
                    this.innerText = "Kit Entregue";
                    setTimeout(() => reiniciarScanner(), 3000);
                } else {
                    alert("Erro ao salvar: " + data.mensagem);
                    this.disabled = false;
                    this.innerText = "Tentar Novamente";
                }
            });
        });

        function reiniciarScanner() {
            linhaAtualSelecionada = null;
            document.getElementById("result-card").style.display = "none";
            document.getElementById("loading").style.display = "none";
            iniciarScanner();
        }

        window.onload = verificarAcesso;
    </script>
</body>
</html>
